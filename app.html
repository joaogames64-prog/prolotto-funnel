// ========== LOTTERY CONFIGS ==========
const LOTTERIES = {
  megasena:   {id:'megasena',   name:'Mega-Sena',   color:'#209869', min:1, max:60, pick:6,  icon:'M'},
  lotofacil:  {id:'lotofacil',  name:'Lotofácil',   color:'#930089', min:1, max:25, pick:15, icon:'L'},
  quina:      {id:'quina',      name:'Quina',        color:'#260085', min:1, max:80, pick:5,  icon:'Q'},
  lotomania:  {id:'lotomania',  name:'Lotomania',    color:'#f78100', min:0, max:99, pick:50, icon:'T'},
  duplasena:  {id:'duplasena',  name:'Dupla-Sena',   color:'#a61324', min:1, max:50, pick:6,  icon:'D'}
};

// ========== STATS HELPERS ==========
function getFrequency() {
  const freq = {};
  for (let i = 1; i <= 25; i++) freq[i] = 0;
  DRAWS.forEach(d => d.nums.forEach(n => freq[n]++));
  return freq;
}

function getHotCold() {
  const freq = getFrequency();
  const sorted = Object.entries(freq).sort((a,b) => b[1] - a[1]);
  return { hot: sorted.slice(0,8).map(e=>({n:+e[0],c:e[1]})), cold: sorted.slice(-8).reverse().map(e=>({n:+e[0],c:e[1]})) };
}

function getPairs() {
  const pairs = {};
  DRAWS.forEach(d => {
    for(let i=0;i<d.nums.length;i++)
      for(let j=i+1;j<d.nums.length;j++){
        const k=d.nums[i]+'-'+d.nums[j];
        pairs[k]=(pairs[k]||0)+1;
      }
  });
  return Object.entries(pairs).sort((a,b)=>b[1]-a[1]).slice(0,15).map(e=>({pair:e[0],c:e[1]}));
}

// ========== AI GENERATOR (generic) ==========
function generateAI(count, lotteryId) {
  const lot = LOTTERIES[lotteryId];
  const range = lot.max - lot.min + 1;

  // For Lotofácil use real frequency data; others use uniform + slight random weighting
  const weights = {};
  if(lotteryId === 'lotofacil') {
    const freq = getFrequency();
    const total = Object.values(freq).reduce((a,b)=>a+b,0);
    for(let i=lot.min;i<=lot.max;i++) weights[i] = (freq[i]||1)/total;
  } else {
    // Simulate weighted distribution for other lotteries
    for(let i=lot.min;i<=lot.max;i++) weights[i] = 1 + Math.random()*0.5;
  }

  const sets = [];
  for(let s=0;s<count;s++){
    const nums = [];
    const pool = Array.from({length:range},(_,i)=>i+lot.min);
    while(nums.length<lot.pick){
      let wSum = pool.reduce((a,n)=>a+weights[n],0);
      let r = Math.random()*wSum, acc=0;
      for(const n of pool){
        acc+=weights[n];
        if(r<=acc){nums.push(n);pool.splice(pool.indexOf(n),1);break;}
      }
    }
    sets.push(nums.sort((a,b)=>a-b));
  }
  return sets;
}

}

function copySet(i) {
  const text = generatedSets[i].map(n=>String(n).padStart(2,'0')).join(' - ');
  navigator.clipboard.writeText(text).then(()=>alert('Jogo copiado!')).catch(()=>{});
}

// ========== TAB: ANÁLISE ==========
function renderAnalise() {
  const freq = getFrequency();
  const {hot,cold} = getHotCold();
  const maxFreq = Math.max(...Object.values(freq));
  const topPairs = getPairs();

  const freqBars = Array.from({length:25},(_,i)=>i+1).map(n=>{
    const pct = Math.round((freq[n]/maxFreq)*100);
    const cls = pct>75?'heat-3':pct>45?'heat-2':'heat-1';
    return `
    <div class="flex items-center gap-2">
      <span class="w-7 text-right text-xs font-bold text-slate-600">${String(n).padStart(2,'0')}</span>
      <div class="flex-1 bg-slate-100 rounded-full h-5 relative overflow-hidden">
        <div class="h-full rounded-full ${cls} flex items-center justify-end pr-2 text-[10px] font-black" style="width:${pct}%">${freq[n]}</div>
      </div>
    </div>`;
  }).join('');

  return `
    <h2 class="text-xl font-black text-slate-800 mb-1">Análise Estatística</h2>
    <p class="text-xs text-slate-500 mb-4">Baseada nos últimos ${DRAWS.length} concursos da Lotofácil</p>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm">

      <div class="bg-white rounded-2xl p-3 border border-slate-200 shadow-sm">
        <p class="text-[10px] font-black text-blue-600 uppercase mb-2">❄️ Mais Frias</p>
        <div class="flex flex-wrap gap-1">${cold.map(c=>`<span class="w-8 h-8 rounded-lg bg-blue-100 text-blue-700 text-xs font-black flex items-center justify-center">${String(c.n).padStart(2,'0')}</span>`).join('')}</div>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm mb-4">
      <p class="text-xs font-black text-slate-700 mb-3">Frequência por Número</p>
      <div class="space-y-1.5">${freqBars}</div>
    </div>

    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
      <p class="text-xs font-black text-slate-700 mb-3">Top 15 Pares Mais Frequentes</p>
      <div class="grid grid-cols-3 gap-2">
        ${topPairs.map((p,i)=>`<div class="flex items-center gap-1.5 bg-slate-50 rounded-lg px-2 py-1.5">
          <span class="text-[10px] font-black text-slate-400">#${i+1}</span>
          <span class="text-xs font-bold text-slate-700">${p.pair}</span>
          <span class="text-[10px] text-[#2ac473] font-black ml-auto">${p.c}x</span>
        </div>`).join('')}
      </div>
    </div>
  `;
}

  `).join('');

  return `
    <h2 class="text-xl font-black text-slate-800 mb-1">Histórico de Resultados</h2>
    <p class="text-xs text-slate-500 mb-4">Últimos ${DRAWS.length} concursos da Lotofácil</p>
    <div class="space-y-2">${rows}</div>
  `;
}

// ========== TAB: SIMULADOR ==========
function renderSimulador() {
  const grid = Array.from({length:25},(_,i)=>i+1).map(n=>{
    const sel = simSelected.includes(n);
    let extra='';
    if(simResult){
      const lastDraw = DRAWS[0].nums;
      if(sel && lastDraw.includes(n)) extra='ring-2 ring-green-400 bg-green-500 text-white';
      else if(sel && !lastDraw.includes(n)) extra='ring-2 ring-red-400 bg-red-100 text-red-500';
      else if(!sel && lastDraw.includes(n)) extra='bg-[#005da8] text-white opacity-60';
    }
    return `<button onclick="toggleSim(${n})" class="ball w-11 h-11 rounded-xl text-sm font-bold flex items-center justify-center border ${sel && !simResult?'ball-selected':'bg-white text-slate-700 border-slate-200 hover:border-[#2ac473]'} ${extra}">
      ${String(n).padStart(2,'0')}
    </button>`;
  }).join('');

  let resultHtml='';
  if(simResult){
    const lastDraw = DRAWS[0].nums;
    const hits = simSelected.filter(n=>lastDraw.includes(n)).length;
    const prizes = {15:'R$ 1.500.000+',14:'R$ 800+',13:'R$ 30,00',12:'R$ 12,00',11:'R$ 6,00'};
    const prize = prizes[hits]||'Nenhum prêmio';
    const color = hits>=13?'text-green-500':hits>=11?'text-yellow-500':'text-red-500';
    resultHtml=`
      <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm text-center fade-in">
        <p class="text-xs text-slate-500 mb-1">Concurso ${DRAWS[0].id} (${DRAWS[0].date})</p>
        <p class="text-3xl font-black ${color}">${hits} acertos</p>
        <p class="text-sm font-bold text-slate-600 mt-1">${prize}</p>
        <button onclick="simSelected=[];simResult=null;render();" class="mt-3 text-xs font-bold text-[#2ac473] hover:underline">Jogar novamente</button>
      </div>`;
  }

  return `
    <h2 class="text-xl font-black text-slate-800 mb-1">Simulador de Aposta</h2>
    <p class="text-xs text-slate-500 mb-1">Escolha 15 números e confira contra o último concurso</p>
    <p class="text-xs font-bold text-[#2ac473] mb-3">${simSelected.length}/15 selecionados</p>
    <div class="grid grid-cols-5 gap-2 mb-4">${grid}</div>
    ${!simResult && simSelected.length===15?`
      <button onclick="simResult=true;render();" class="w-full py-3.5 rounded-xl bg-[#005da8] text-white font-black text-sm uppercase tracking-wider shadow-lg">
        CONFERIR RESULTADO
      </button>`:''}
    ${resultHtml}
  `;
}

function toggleSim(n){
  if(simResult) return;
  const i=simSelected.indexOf(n);
  if(i>-1) simSelected.splice(i,1);
  else if(simSelected.length<15) simSelected.push(n);
  render();
}

// ========== INIT ==========
render();
</script>
</body>
</html>
