  <!-- UTM CAPTURE & PERSISTENCE HELPER -->
  <script>
    function getUtmData() {
      var keys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','src','fbclid','gclid','sck','click_id','lwtrk','sub1','sub2','sub3','sub4','sub5'];
      var result = {};
      var searchParams = new URLSearchParams(window.location.search);
      var hashParams = new URLSearchParams(window.location.hash.substring(1));

      var cookies = {};
      (document.cookie || '').split(';').forEach(function(c) {
        var parts = c.split('=');
        if (parts.length === 2) cookies[parts[0].trim()] = decodeURIComponent(parts[1].trim());
      });

      keys.forEach(function(k) {
        var val = searchParams.get(k)
               || hashParams.get(k)
               || localStorage.getItem('plt_' + k)
               || localStorage.getItem(k)
               || localStorage.getItem('_' + k)
               || sessionStorage.getItem('plt_' + k)
               || sessionStorage.getItem(k)
               || sessionStorage.getItem('_' + k)
               || cookies['plt_' + k]
               || cookies[k]
               || cookies['_' + k]
               || '';
        if (val) {
          result[k] = val;
          try {
            localStorage.setItem('plt_' + k, val);
            localStorage.setItem(k, val);
            sessionStorage.setItem('plt_' + k, val);
            sessionStorage.setItem(k, val);
          } catch(e) {}
        }
      });

      // Deep scan localStorage for any utm or lowtrack keys
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var lk = localStorage.key(i);
          if (lk && (lk.indexOf('utm') !== -1 || lk.indexOf('lt_') !== -1 || lk.indexOf('lowtrack') !== -1 || lk.indexOf('click') !== -1 || lk.indexOf('src') !== -1 || lk.indexOf('sck') !== -1)) {
            var lv = localStorage.getItem(lk);
            if (lv && typeof lv === 'string' && lv.length < 250) {
              var cleanKey = lk.replace(/^plt_/, '').replace(/^_/, '');
              if (!result[cleanKey]) result[cleanKey] = lv;
            }
          }
        }
      } catch(e) {}

      // Organic Referrer Fallback
      if (!result['utm_source'] && !result['src']) {
        var ref = document.referrer || '';
        if (ref) {
          if (ref.indexOf('facebook.com') !== -1 || ref.indexOf('fb.me') !== -1) {
            result['utm_source'] = 'facebook';
            result['src'] = 'facebook_organic';
          } else if (ref.indexOf('instagram.com') !== -1) {
            result['utm_source'] = 'instagram';
            result['src'] = 'instagram_organic';
          } else if (ref.indexOf('google.') !== -1) {
            result['utm_source'] = 'google';
            result['src'] = 'google_organic';
          } else if (ref.indexOf('tiktok.com') !== -1) {
            result['utm_source'] = 'tiktok';
            result['src'] = 'tiktok_organic';
          } else if (ref.indexOf(window.location.hostname) === -1) {
            result['src'] = ref.substring(0, 100);
          }
        }
      }

      return result;
    }

    // Auto-run on load
    (function() {
      getUtmData();
    })();
  </script>

          // Fallback synthesized chime sound using Web Audio API
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(2093, ctx.currentTime);
            gain.gain.setValueAtTime(0.6, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.8);
          }
        });
      } catch (e) {
        console.warn("Audio play error", e);
      }
    }

          const isSelected = (id === lotteryId);
          const item = LOTTERIES[id];
          if (!item || item.locked) return;

          const badgeText = card.querySelector('.status-badge-text');
          const radioCircle = card.querySelector('.radio-circle');

          if (isSelected) {
            card.className = "relative w-full rounded-2xl p-4 flex items-center justify-between transition-all duration-200 gap-4 bg-white ring-2 ring-offset-0 shadow-lg scale-[1.02]";
            card.style.borderColor = item.color_primary;
            card.style.boxShadow = `0 10px 25px -5px ${item.color_primary}30`;
            card.style.setProperty('--tw-ring-color', item.color_primary);
            if (badgeText) badgeText.innerText = 'SELECIONADO';
            if (radioCircle) {
              radioCircle.className = "radio-circle w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all duration-200 border-transparent";
              radioCircle.style.backgroundColor = item.color_primary;
              radioCircle.innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-white shadow-sm"></div>';
            }
          } else {
            card.className = "relative w-full rounded-2xl p-4 flex items-center justify-between transition-all duration-200 gap-4 bg-white border border-slate-100 shadow-sm hover:shadow-md hover:border-slate-200";
            card.style.borderColor = '';
            card.style.boxShadow = '';
            card.style.removeProperty('--tw-ring-color');
            if (badgeText) badgeText.innerText = 'CLIQUE PARA ESCOLHER';

    function toggleSimNumber(num) {
      if (state.simResultState === 'result') return;
      const lottery = LOTTERIES[state.selectedLottery] || LOTTERIES.megasena;
      const index = state.simSelected.indexOf(num);

      if (index > -1) {
        state.simSelected.splice(index, 1);
      } else {
        if (state.simSelected.length < lottery.pick_count) {
          state.simSelected.push(num);
          state.simSelected.sort((a, b) => a - b);
        } else {
          alert(`Você já selecionou o máximo de ${lottery.pick_count} números para a ${lottery.name}.`);
        }
      }
      render();
    }

    function verifySimResult() {
      const lottery = LOTTERIES[state.selectedLottery] || LOTTERIES.megasena;
      const picked = [...state.simSelected];
      const numbersCount = lottery.max_number - lottery.min_number + 1;
      const allNumbers = Array.from({ length: numbersCount }, (_, i) => i + lottery.min_number);

      let hitsCount = 0;
      const rand = Math.random();

      if (lottery.id === 'lotofacil') {
        hitsCount = state.simRound === 1 ? 10 : 11;
      } else {
        if (state.simRound === 1) {
          hitsCount = rand < 0.4 ? 0 : rand < 0.8 ? 1 : 2;
        } else {
          hitsCount = rand < 0.6 ? 0 : 1;
        }
      }

      // Pick hit numbers from user's selection
      const matchedPicks = picked.sort(() => 0.5 - Math.random()).slice(0, hitsCount);
      
      // Remaining draw numbers from non-picked numbers
      const nonPicked = allNumbers.filter(n => !picked.includes(n)).sort(() => 0.5 - Math.random());
      const remainingDrawCount = lottery.pick_count - hitsCount;
      const matchedNonPicks = nonPicked.slice(0, remainingDrawCount);

      state.simDraw = [...matchedPicks, ...matchedNonPicks].sort((a, b) => a - b);
      state.simHits = hitsCount;
      state.simResultState = 'result';
      render();
    }

    function nextSimRound() {
      if (state.simRound === 1) {
        state.simRound = 2;
        state.simSelected = [];
        state.simResultState = 'playing';
        state.simHits = 0;
        state.simDraw = [];
        render();

        setView('upsell');

    }

      const numbersCount = lottery.max_number - lottery.min_number + 1;
      const allNumbers = Array.from({ length: numbersCount }, (_, i) => i + lottery.min_number);
      
      // Random targets for AI recommended picks
      state.aiTargetNumbers = allNumbers.sort(() => 0.5 - Math.random()).slice(0, lottery.pick_count).sort((a, b) => a - b);

                >

                </button>
              ` : `

    function toggleAINumber(num) {
      if (state.aiResultState === 'result') return;
      const lottery = LOTTERIES[state.selectedLottery] || LOTTERIES.megasena;
      const index = state.aiSelected.indexOf(num);

      if (index > -1) {
        state.aiSelected.splice(index, 1);

          state.aiSelected.push(num);
          state.aiSelected.sort((a, b) => a - b);
        }
      }
      render();
    }

    function verifyAIResult() {
      playCashSound();

      const lottery = LOTTERIES[state.selectedLottery] || LOTTERIES.megasena;
      const picked = [...state.aiSelected];
      const numbersCount = lottery.max_number - lottery.min_number + 1;
      const allNumbers = Array.from({ length: numbersCount }, (_, i) => i + lottery.min_number);

      let hitsCount = 0;
      let prizeAmount = 0;

      if (lottery.id === 'megasena' || lottery.id === 'duplasena') {
        if (state.aiRound === 1) {
          hitsCount = 4;
          prizeAmount = Math.floor(Math.random() * 701) + 500;

          prizeAmount = Math.floor(Math.random() * 90001) + 30000;

      } else if (lottery.id === 'lotofacil') {

          prizeAmount = Math.floor(Math.random() * 701) + 500;
        } else {
          hitsCount = lottery.pick_count;
          prizeAmount = Math.floor(Math.random() * 90001) + 30000;
        }
      }

      const matchedPicks = picked.slice(0, hitsCount);
      const nonPicked = allNumbers.filter(n => !picked.includes(n)).sort(() => 0.5 - Math.random());
      const matchedNonPicks = nonPicked.slice(0, lottery.pick_count - hitsCount);

      state.aiDraw = [...matchedPicks, ...matchedNonPicks].sort((a, b) => a - b);
      state.aiHits = hitsCount;
      state.aiPrize = prizeAmount;
      state.aiTotalBalance += prizeAmount;
      state.aiResultState = 'result';
      render();

    function startLoading() {

      setView('loading');

      if (loadingInterval) clearInterval(loadingInterval);
      if (loadingTimeout) clearTimeout(loadingTimeout);

      // 50ms × 100 steps = 5 seconds total
      loadingInterval = setInterval(() => {
        if (state.loadingProgress >= 100) {
          clearInterval(loadingInterval);
          return;
        }

        state.loadingProgress++;

        if (state.loadingProgress === 20) state.loadingStatusText = "Processando histórico de jogos...";
        if (state.loadingProgress === 45) state.loadingStatusText = "Comparando com padrões de ganhadores...";
        if (state.loadingProgress === 75) state.loadingStatusText = "Calculando probabilidade de sucesso...";
        if (state.loadingProgress === 90) state.loadingStatusText = "Gerando estratégia personalizada...";

        const barFill = document.getElementById('loading-bar-fill');
        const percentText = document.getElementById('loading-percent-text');
        const statusText = document.getElementById('loading-status-text');
        const alertBox = document.getElementById('loading-alert-box');

        if (barFill) barFill.style.width = state.loadingProgress + '%';
        if (percentText) percentText.innerText = state.loadingProgress + '% CONCLUÍDO';
        if (statusText) statusText.innerText = state.loadingStatusText;
        if (alertBox && state.loadingProgress > 50) {

        if (!box || !text) return;

        msgIndex = (msgIndex + 1) % VSL_SOCIAL_PROOF_MSGS.length;
        text.innerText = VSL_SOCIAL_PROOF_MSGS[msgIndex];
        box.classList.remove('hidden');
        box.querySelector('div').classList.remove('animate-fade-in-up');
        void box.querySelector('div').offsetWidth;
        box.querySelector('div').classList.add('animate-fade-in-up');

        setTimeout(() => { if (box) box.classList.add('hidden'); }, 4000);
      }

      // First notification after 8s, then every 18s
      setTimeout(() => {
        showNextProof();
        vslSocialProofInterval = setInterval(showNextProof, 18000);
      }, 8000);

      // Exit Intent (back button / popstate)
      if (!exitIntentAttached) {
        exitIntentAttached = true;
        history.pushState(null, '', window.location.href);
        window.addEventListener('popstate', function onExitIntent() {
          if (state.currentView !== 'checkoutVideo') {
            window.removeEventListener('popstate', onExitIntent);
            exitIntentAttached = false;
            return;
          }
          history.pushState(null, '', window.location.href);
          const modal = document.getElementById('exit-intent-modal');
          if (modal) modal.classList.remove('hidden');
        });
      }
    }

    function revealCtaButton() {
      const ctaContainer = document.getElementById('checkout-cta-container');
      if (ctaContainer) {
        ctaContainer.classList.remove('hidden');
        ctaContainer.classList.add('block');
      }
    }

    // --- UTM-PRESERVING CHECKOUT REDIRECT ---
    function goToCheckout() {
      var utms = getUtmData();
      var out = new URLSearchParams();
      Object.keys(utms).forEach(function(k) {
        if (utms[k]) out.set(k, utms[k]);
      });

      var qs = out.toString();
      window.location.href = 'checkout.html' + (qs ? '?' + qs : '');
    }

    function navigateToCheckout() {
      goToCheckout();
    }

    // --- MAIN RENDER ROUTER ---
    function render() {
      const appEl = document.getElementById('app');
      let html = '';

      switch (state.currentView) {
        case 'hero':
          html = renderHeroView();
          break;
        case 'selection':
          html = renderSelectionView();
          break;
        case 'simulator':
          html = renderSimulatorView();
          break;
        case 'upsell':
          html = renderUpsellView();
          break;
        case 'simulatorAI':
          html = renderSimulatorAIView();
          break;
        case 'resultsSummary':
          html = renderResultsSummaryView();
          break;
        case 'quiz':
          html = renderQuizView();
          break;
        case 'loading':
          html = renderLoadingView();
          break;
        case 'checkoutVideo':
          html = renderCheckoutVideoView();
          break;
        default:
          html = renderHeroView();
      }

      appEl.innerHTML = html;
    }

    // Initialize application
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>

</html>
